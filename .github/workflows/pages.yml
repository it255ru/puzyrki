# Публикация на GitHub Pages: index.html + assets/.
# Запускается при каждом push в main после прохождения тестов.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: mkdir dist && cp index.html dist/ && cp -r assets dist/assets
      # Метка сборки (хеш коммита и время) видна в игре — по ней отличают актуальную версию от кеша
      - run: |
          grep -q '"__BUILD__"' dist/index.html
          sed -i "s/\"__BUILD__\"/\"${GITHUB_SHA::7} $(date -u '+%Y-%m-%d %H:%M')\"/" dist/index.html
          grep -q '__BUILD__' dist/index.html && exit 1 || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
