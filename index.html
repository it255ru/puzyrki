<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пузырьки</title>
    <style type="text/css">
        body {
            margin: 0;
            background: black;
            overflow: hidden;
        }
        #game {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Толщина рамки (5px) учитывается в resize() — см. CANVAS_BORDER */
        canvas {
            border: 5px dashed gold;
        }
    </style>
</head>
<body>
    <div id="game">
        <canvas id="canvas" height=720 width=1280>
        </canvas>
    </div>
</body>
<script type="text/javascript">
// ========== vars.js ==========
const c = {w: 1280, h: 720}
const weight = 0.2;
// r — радиус, weightMod — множитель гравитации (большие шары «плавают» медленнее).
// Отскок упругий (без потерь): высота прыжка определяется высотой падения.
const sizes = [
    { r: 10, weightMod: 1 },
    { r: 20, weightMod: 1 },
    { r: 30, weightMod: 1 },
    { r: 40, weightMod: 1 },
    { r: 50, weightMod: 1 },
    { r: 70, weightMod: 0.7 },
    { r: 80, weightMod: 0.4 },
];
// Начальная вертикальная скорость шара (вверх), px за шаг.
const INITIAL_DY = -5;
// Попадание гарпуном подбрасывает шар: осколки получают вертикальный импульс
// вверх, достаточный, чтобы подняться на HIT_RISE пикселей над точкой попадания
// (у шаров с разной «плавучестью» weightMod импульс разный, а высота — одна).
// Если шар уже летел вверх, импульсы складываются, и серия точных попаданий
// поднимает его до потолка.
const HIT_RISE = 100;

// Импульс (px за шаг, вверх) для шара данного размера.
function hitImpulse(size) {
    return Math.sqrt(2 * weight * sizes[size].weightMod * HIT_RISE);
}

// Предел вертикальной скорости после попаданий: из любой точки поля до потолка.
function maxRiseSpeed(size) {
    return Math.sqrt(2 * weight * sizes[size].weightMod * c.h);
}
let levels = [];
// Потолок с шипами: полоса сверху высотой SPIKE_HEIGHT. Шар, коснувшийся шипов,
// лопается целиком (без осколков). Включается в данных уровня: spikes: true.
const SPIKE_HEIGHT = 30;
const SPIKE_WIDTH = 40;
let currentSpikes = false;
// Гарпун, долетев до потолка, прилипает на STICK_FRAMES шагов (~0,5 с).
const STICK_FRAMES = 30;
// Расстояние от острия до верха полосы гарпуна (наконечник — 15 px над концом древка)
const HARPOON_TIP = 15;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let time = 0;
let gameSpeed = 1;
let level = 0;
let debug = false;
let debugHeld = false;
// >0 — пауза между уровнями, 0 — пора загрузить уровень, -1 — уровень загружен
let levelCountdown = -1;

let currentKeys = {};

let harpoons = [];

let pause = false;
let pauseHeld = false;
let restartHeld = false;
// Фиксированный шаг логики 60 Гц; отрисовка — на каждый кадр браузера
// с интерполяцией между предыдущим и текущим состоянием.
const STEP_MS = 1000 / 60;
const MAX_FRAME_MS = 250;   // после паузы/просадки не пытаемся «догнать» больше этого
let lastTimestamp = null;
let accumulator = 0;
let renderAlpha = 1;        // доля шага для интерполяции при отрисовке (0..1)
let fatalError = null;      // исключение в цикле: игра показывает ошибку, а не замирает
const CANVAS_BORDER = 5;    // должно совпадать с border в CSS
let prevKeys = {};
const START_COOLDOWN = 20;

// ===== НОВОЕ: состояние игры и жизни =====
// "title" | "playing" | "gameover" | "win"
let gameState = "title";
// Жизни и неуязвимость у каждого игрока свои (поля Player: lives, invulnerable, out).
const MAX_LIVES = 3;
// Неуязвимость после потери жизни и при подключении (в шагах), чтобы
// не потерять все жизни за одно касание.
const INVULNERABLE_FRAMES = 120;
const HUD_PLAYER_WIDTH = 230;   // ширина блока жизней одного игрока в HUD

// Схемы управления. Клавиатура задаётся физическим кодом (KeyboardEvent.code
// в нижнем регистре), поэтому не зависит от раскладки и Shift:
// ←/→ — движение, ↑ — выстрел. Мышь: смещение влево/вправо — движение
// (с захватом курсора, Pointer Lock), левая кнопка — выстрел.
// Схема привязана к игроку (player.control), а не к его номеру.
const MAX_PLAYERS = 2;
const controls = {
    keyboard: { "arrowleft": "left", "arrowright": "right", "arrowup": "shoot" },
};
const MOUSE_SENSITIVITY = 1;   // логических пикселей поля на пиксель смещения мыши
const MOUSE_MAX_STEP = 60;     // максимум движения мышью за один шаг (логических px)
const LOCK_WAIT_FRAMES = 90;   // сколько шагов ждать ответа на запрос захвата курсора
let mouse = { dx: 0, held: false, clicked: false };
let viewScale = 1;             // CSS-пикселей на логический пиксель (задаёт resize)
let pausedByLockLoss = false;  // пауза из-за потери захвата курсора
let lockError = false;         // запрос захвата отклонён или не поддерживается
let lockPendingUntil = 0;      // до какого шага ждём ответа на запрос захвата

// Синий и оранжевый хорошо различаются, в том числе при дальтонизме.
let playerColors = [
    "#42a5f5",
    "#ff9800",
];

let currentLevel = [];
let players = [];

// ========== classes.js ==========
class Shape {
    constructor(position, color) {
        this.x = position.x;
        this.y = position.y;
        this.px = this.x;   // позиция на предыдущем шаге — для интерполяции
        this.py = this.y;
        this.color = color || "#666";
    }

    // Запомнить текущую позицию перед очередным шагом логики.
    savePrev() {
        this.px = this.x;
        this.py = this.y;
    }

    // Мгновенный перенос (без «скольжения» при отрисовке).
    snap() {
        this.px = this.x;
        this.py = this.y;
    }

    get drawX() { return this.px + (this.x - this.px) * renderAlpha; }
    get drawY() { return this.py + (this.y - this.py) * renderAlpha; }
}

class Harpoon extends Shape {
    constructor(position, owner, color, modifiers) {
        super(position, color);
        this.h = 0;
        this.ph = 0;
        this.hits = 0;
        this.stuck = 0;          // >0 — прилип к потолку, осталось шагов
        this.isStuck = false;
        this.owner = owner;
        this.popping = true;
        this.modifiers = modifiers || {};
        this.modifiers.speed = this.modifiers.speed || 12;
        this.modifiers.maxHits = this.modifiers.maxHits || 1;
    }

    savePrev() {
        super.savePrev();
        this.ph = this.h;
    }

    draw(ctx) {
        // Перед исчезновением прилипший гарпун мигает
        if (this.isStuck && this.stuck < 10 && Math.floor(this.stuck / 2) % 2 === 1) {
            return;
        }
        const x = this.drawX;
        const y = this.drawY;
        const h = this.ph + (this.h - this.ph) * renderAlpha;
        ctx.fillStyle = this.color;
        ctx.fillRect(x - 1, y - h, 3, h);

        ctx.beginPath();
        ctx.moveTo(x - 2, y - h);
        ctx.lineTo(x + 0.5, y - h - 15);
        ctx.lineTo(x + 3, y - h);
        ctx.fill();
    }

    bounds() {
        return {
            x1: this.x - 1,
            x2: this.x + 2,
            y1: this.y - this.h - 15,
            y2: this.y,
        };
    }

    // Высота (y древка), на которой гарпун упирается в потолок или шипы.
    static stopY() {
        return (currentSpikes ? SPIKE_HEIGHT : 0) + HARPOON_TIP;
    }

    // Летит вверх; у потолка прилипает на STICK_FRAMES шагов.
    // Возвращает false, когда гарпун должен исчезнуть.
    update(speed) {
        if (this.isStuck) {
            this.stuck -= speed;
            return this.stuck > 0;
        }
        this.h += this.modifiers["speed"] * speed;
        const maxH = this.y - Harpoon.stopY();
        if (this.h >= maxH) {
            this.h = maxH;
            this.isStuck = true;
            this.stuck = STICK_FRAMES;
        }
        return true;
    }
}

class Enemy extends Shape {
    constructor(size, position, color) {
        super(position, color);
        this.size = size;
    }
    intersects(shape) {}
}

class Circle extends Enemy {
    constructor(size, position, initialSpeed, color) {
        super(size, position, color);
        const thisSize = sizes[size];
        if (!thisSize) throw new RangeError(`Circle: неизвестный размер ${size}`);
        this.dx = initialSpeed;
        this.dy = INITIAL_DY;
        this.r = thisSize.r;
        this.weightMod = thisSize.weightMod || 1;
        this.touchedCeiling = false;
    }

    draw(ctx) {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.drawX, this.drawY, this.r, 0, 2 * Math.PI);
        ctx.closePath();
        ctx.fill();
    }

    bounds() {
        return {
            x1: this.x - this.r,
            y1: this.y - this.r,
            x2: this.x + this.r,
            y2: this.y + this.r,
        }
    }

    // Движение с постоянным ускорением: y += v·t + g·t²/2, v += g·t.
    // Пол и потолок отражают шар в точный момент касания (шаг делится на части),
    // поэтому отскок упругий без потерь и накопления ошибки: высота прыжка
    // определяется высотой падения. Стены отражают положение зеркально
    // (по x движение равномерное, так что это точно).
    update(speed) {
        const g = weight * this.weightMod;
        this.x += this.dx * speed;
        if (this.x < this.r) {
            this.x = 2 * this.r - this.x;
            this.dx = Math.abs(this.dx);
        } else if (this.x > c.w - this.r) {
            this.x = 2 * (c.w - this.r) - this.x;
            this.dx = -Math.abs(this.dx);
        }
        this.x = Math.min(Math.max(this.x, this.r), c.w - this.r);

        const top = this.r;
        const floor = c.h - this.r;
        this.touchedCeiling = false;
        let remaining = speed;
        for (let i = 0; i < 4 && remaining > 0; i++) {
            const y1 = this.y + this.dy * remaining + 0.5 * g * remaining * remaining;
            if (y1 >= top && y1 <= floor) {
                this.y = y1;
                this.dy += g * remaining;
                remaining = 0;
                break;
            }
            // Время касания границы: 0.5·g·t² + v·t + (y − граница) = 0
            const hitFloor = y1 > floor;
            const border = hitFloor ? floor : top;
            const disc = Math.max(this.dy * this.dy - 2 * g * (this.y - border), 0);
            const root = Math.sqrt(disc);
            let t = hitFloor ? (-this.dy + root) / g : (-this.dy - root) / g;
            t = Math.min(Math.max(t, 0), remaining);
            this.dy += g * t;
            this.y = border;
            this.dy = hitFloor ? -Math.abs(this.dy) : Math.abs(this.dy);
            if (!hitFloor) this.touchedCeiling = true;
            remaining -= t;
        }
        this.y = Math.min(Math.max(this.y, top), floor);
    }

    // Круг пересекается с прямоугольником bound {x1, x2, y1, y2}:
    // расстояние от центра до ближайшей точки прямоугольника не больше радиуса.
    intersects(bound) {
        const nx = Math.min(Math.max(this.x, bound.x1), bound.x2);
        const ny = Math.min(Math.max(this.y, bound.y1), bound.y2);
        const dx = this.x - nx;
        const dy = this.y - ny;
        return dx * dx + dy * dy <= this.r * this.r;
    }
}

class Player extends Shape {
    constructor(position, playerNumber) {
        super(position, playerColors[playerNumber]);
        this.number = playerNumber;
        this.cooldown = 0;
        this.shooting = false;
        this.modifiers = {
            speed: 1,
            maxShots: 1,
            cooldown: 15,
        };
        this.shots = this.modifiers.maxShots;
        this.lives = MAX_LIVES;
        this.invulnerable = 0;   // осталось шагов неуязвимости
        this.out = false;        // потерял все жизни и выбыл из игры
        this.spawnX = position.x;
        this.control = "keyboard";   // "keyboard" | "mouse"
    }

    draw(ctx) {
        if (this.out) return;
        // Мигание во время неуязвимости
        if (this.invulnerable > 0 && Math.floor(time / 5) % 2 === 0) {
            return;
        }
        const x = this.drawX;
        const y = this.drawY;
        ctx.fillStyle = this.color;
        ctx.fillRect(x - 15, y - 25, 30, 50);
        ctx.strokeRect(x - 15, y - 25, 30, 50);
        // Метка с номером над игроком — различима и без цвета
        ctx.font = "bold 20px sans-serif";
        ctx.textAlign = "center";
        ctx.fillStyle = "#fff";
        ctx.fillText(String(this.number + 1), x, y - 32);
        ctx.textAlign = "left";
    }

    bounds() {
        return {
            x1: this.x - 15,
            x2: this.x + 15,
            y1: this.y - 25,
            y2: this.y + 25,
        }
    }

    update(speed) {
        if (this.out) return;
        const {speed: speedMod} = this.modifiers;
        const input = readInput(this.control);
        if (this.control === "mouse") {
            // Смещение мыши за шаг (в CSS-пикселях) переводим в логические, с ограничением рывка
            const move = input.moveX / viewScale * MOUSE_SENSITIVITY;
            this.x += Math.max(-MOUSE_MAX_STEP, Math.min(MOUSE_MAX_STEP, move));
            this.x = Math.max(15, Math.min(c.w - 15, this.x));
        } else if (input["left"] && !input["right"]) {
            this.x -= 5 * speed * speedMod;
            if (this.x < 15) this.x = 15;
        } else if (input["right"] && !input["left"]) {
            this.x += 5 * speed * speedMod;
            if (this.x > c.w - 15) this.x = c.w - 15;
        }
        this.cooldown -= 1 * speed;
        if (this.cooldown <= 0 && input["shoot"] && this.shots > 0) {
            this.shots--;
            this.cooldown = this.modifiers.cooldown;
            // ИСПРАВЛЕНО: передаём цвет игрока гарпуну
            harpoons.push(new Harpoon({x: this.x, y: this.y + 25}, this, this.color));
        }
        if (this.control === "mouse") {
            // Смещение и щелчок использованы — не применять их повторно
            mouse.dx = 0;
            mouse.clicked = false;
        }
    }

    freeShot() {
        if (this.shots < this.modifiers.maxShots) {
            this.shots++;
        }
    }
}

// Действия по схеме управления: left/right/shoot (клавиатура) или
// shoot и moveX — смещение мыши с прошлого шага (мышь).
function readInput(scheme) {
    const input = {};
    if (scheme === "mouse") {
        input.shoot = mouse.held || mouse.clicked;
        input.moveX = mouseLocked() ? mouse.dx : 0;
        return input;
    }
    const map = controls[scheme] || {};
    for (const key of Object.keys(currentKeys)) {
        if (currentKeys[key] && map[key]) {
            input[map[key]] = true;
        }
    }
    return input;
}

// ========== levels.js ==========
// Уровни — данные: { balls: [{ size, x, y, dx, color? }], spikes?: boolean }.
// Объекты Circle создаются заново при каждой загрузке (см. loadLevel).
levels = [
    { balls: [
        { size: 2, x: c.w / 2, y: 200, dx: 3, color: "#e91e63" },
    ] },
    { spikes: true, balls: [
        { size: 2, x: c.w / 3, y: 200, dx: -3, color: "#9c27b0" },
        { size: 2, x: c.w * 2 / 3, y: 200, dx: 3, color: "#9c27b0" },
    ] },
    { spikes: true, balls: [
        { size: 3, x: c.w / 2, y: 200, dx: 3, color: "#009688" },
    ] },
    { spikes: true, balls: [
        { size: 3, x: c.w / 2, y: 200, dx: 4, color: "#009688" },
    ] },
    { spikes: true, balls: [
        { size: 0, x: 100, y: 500, dx: 3 },
        { size: 1, x: 200, y: 500, dx: 3 },
        { size: 2, x: 300, y: 500, dx: 3 },
        { size: 1, x: 400, y: 500, dx: 3 },
        { size: 0, x: 500, y: 500, dx: 3 },
    ] },
];

// Высота зоны игрока снизу: шар не должен стартовать над головой игрока.
const PLAYER_ZONE = 50;

// Проверка данных уровня; бросает Error с номером уровня и шара.
function validateLevel(def, index) {
    const where = (i) => `уровень ${index + 1}, шар ${i + 1}`;
    if (!def || !Array.isArray(def.balls) || def.balls.length === 0) {
        throw new Error(`уровень ${index + 1}: нужен непустой список balls`);
    }
    if (def.spikes !== undefined && typeof def.spikes !== "boolean") {
        throw new Error(`уровень ${index + 1}: spikes должен быть true или false`);
    }
    def.balls.forEach((b, i) => {
        if (!Number.isInteger(b.size) || b.size < 0 || b.size >= sizes.length) {
            throw new Error(`${where(i)}: size должен быть целым от 0 до ${sizes.length - 1}, получено ${b.size}`);
        }
        const r = sizes[b.size].r;
        if (!Number.isFinite(b.x) || b.x < r || b.x > c.w - r) {
            throw new Error(`${where(i)}: x=${b.x} вне [${r}, ${c.w - r}]`);
        }
        if (!Number.isFinite(b.y) || b.y < r || b.y + r > c.h - PLAYER_ZONE) {
            throw new Error(`${where(i)}: y=${b.y} вне [${r}, ${c.h - PLAYER_ZONE - r}]`);
        }
        if (!Number.isFinite(b.dx)) {
            throw new Error(`${where(i)}: dx должен быть числом, получено ${b.dx}`);
        }
        if (b.color !== undefined && typeof b.color !== "string") {
            throw new Error(`${where(i)}: color должен быть строкой`);
        }
    });
}

function createBalls(def) {
    return def.balls.map((b) => new Circle(b.size, { x: b.x, y: b.y }, b.dx, b.color));
}

levels.forEach(validateLevel);

// ========== index.js ==========
function checkHit(type, targetType, maxHits) {
    const toSplit = new Set();
    let hits = 0;
    for (const t1 of type) {
        const b1 = t1.bounds();
        for (let i = 0; i < targetType.length; i++) {
            if (toSplit.has(i)) continue;
            const t2 = targetType[i];
            if (!t2.intersects(b1)) continue;
            if (t1.popping) toSplit.add(i);
            hits++;
            if (maxHits && hits >= maxHits) break;
        }
        if (maxHits && hits >= maxHits) break;
    }
    [...toSplit].sort((a, b) => b - a).forEach(i => split(i, targetType));
    return hits;
}

function split(index, array) {
    const obj = array[index];
    if (!obj) return;
    array.splice(index, 1);
    const size = obj.size - 1;
    if (size >= 0) {
        const dx = obj.dx || (Math.random() > 0.5 ? 2 : -2);
        const r = sizes[size].r;
        // Осколки расходятся в стороны. Падение гасится, подъём сохраняется,
        // сверху добавляется импульс попадания (с ограничением по скорости).
        const dy = Math.max(Math.min(obj.dy || 0, 0) - hitImpulse(size), -maxRiseSpeed(size));
        for (const side of [1, -1]) {
            const x = Math.min(Math.max(obj.x + side * r * 0.5, r), c.w - r);
            const child = new obj.constructor(size, { x, y: obj.y }, side * dx, obj.color);
            child.dy = dy;
            array.push(child);
        }
    }
}

function paused() {
    if (currentKeys["escape"] || currentKeys["keyp"]) {
        if (!pauseHeld) pause = !pause;
        pauseHeld = true;
    } else {
        pauseHeld = false;
    }
    return pause;
}

function printKeys(ctx) {
    if (currentKeys) {
        let message = "";
        for (const key of Object.keys(currentKeys)) {
            if (currentKeys[key]) {
                message += key + " ";
            }
        }
        ctx.font = "24px sans-serif";
        ctx.fillStyle = "#bbb";
        ctx.fillText(message, 10, 30);
    }
}

// Расставить игроков, оставшихся в игре, равномерно по ширине; запомнить точку старта.
function positionPlayers() {
    const active = players.filter((p) => !p.out);
    active.forEach((player, i) => {
        player.y = c.h - 25;
        player.x = c.w * (i + 1) / (active.length + 1);
        player.spawnX = player.x;
        player.snap();
    });
}

// Шары создаются заново из данных уровня, поэтому каждая загрузка
// (старт нового уровня, рестарт) начинается с исходного состояния.
function loadLevel(n) {
    currentLevel = createBalls(levels[n]);
    currentSpikes = !!levels[n].spikes;
    harpoons = [];
    for (const p of players) {
        p.shots = p.modifiers.maxShots;
        p.cooldown = 0;
    }
    positionPlayers();
}

// Игрок задет шаром: теряет жизнь, возвращается на старт и получает неуязвимость.
// Шары и уровень не сбрасываются. Без жизней игрок выбывает; когда выбыли все — GAME OVER.
function onPlayerHit(player) {
    player.lives--;
    harpoons = harpoons.filter((h) => h.owner !== player);
    player.shots = player.modifiers.maxShots;
    player.cooldown = 0;
    if (player.lives <= 0) {
        player.out = true;
        if (players.every((p) => p.out)) {
            gameState = "gameover";
            harpoons = [];
        }
    } else {
        player.x = player.spawnX;
        player.snap();
        player.invulnerable = INVULNERABLE_FRAMES;
    }
}

// ===== НОВОЕ: полный рестарт игры =====
function restart() {
    level = 0;
    levelCountdown = -1;
    pause = false;
    for (const p of players) {
        p.lives = MAX_LIVES;
        p.invulnerable = 0;
        p.out = false;
    }
    loadLevel(0);
    // Кнопка выстрела, которой запускали игру, ещё нажата — не стрелять сразу
    for (const p of players) p.cooldown = START_COOLDOWN;
    gameState = "playing";
}

// Новая игра. config: число игроков (1 — клавиатура; 2 — клавиатура + мышь)
// или { controls: ["keyboard" | "mouse", ...] } — схема каждого игрока.
function startGame(config) {
    const list = typeof config === "number"
        ? (config >= 2 ? ["keyboard", "mouse"] : ["keyboard"])
        : config.controls.slice(0, MAX_PLAYERS);
    players = list.map((control, i) => {
        const player = new Player({x: c.w / 2, y: c.h - 25}, i);
        player.control = control;
        return player;
    });
    restart();
}

// Шары, коснувшиеся шипов, лопаются целиком (без осколков).
// Возвращает число лопнувших шаров.
function burstAtSpikes() {
    if (!currentSpikes) return 0;
    let burst = 0;
    for (let i = currentLevel.length - 1; i >= 0; i--) {
        const ball = currentLevel[i];
        if (ball.y - ball.r <= SPIKE_HEIGHT || ball.touchedCeiling) {
            currentLevel.splice(i, 1);
            burst++;
        }
    }
    return burst;
}

function logic() {
    if (currentLevel.length == 0) {
        if (levelCountdown > 0) {
            levelCountdown--;
        } else if (levelCountdown === 0) {
            levelCountdown = -1;
            loadLevel(level);
        } else if (level + 1 < levels.length) {
            level++;
            levelCountdown = 90;
        } else {
            // ИСПРАВЛЕНО: раньше после последнего уровня игра просто
            // зависала на пустом экране. Теперь — победа.
            gameState = "win";
            return;
        }
    }

    for (let enemy of currentLevel) {
        enemy.update(gameSpeed);
    }
    burstAtSpikes();

    for (let player of players) {
        if (player.out) continue;
        if (player.invulnerable > 0) {
            player.invulnerable -= gameSpeed;
        }
        player.update(gameSpeed);
        // Неуязвимость защищает от повторного срабатывания.
        if (player.invulnerable <= 0 && checkHit([player], currentLevel, 1)) {
            onPlayerHit(player);
            if (gameState !== "playing") return;
        }
    }

    for (let i = harpoons.length - 1; i >= 0; i--) {
        const harpoon = harpoons[i];
        const alive = harpoon.update(gameSpeed);
        harpoon.hits += checkHit([harpoon], currentLevel, harpoon.modifiers.maxHits);
        if (harpoon.hits >= harpoon.modifiers.maxHits || !alive) {
            harpoons.splice(i, 1);
            harpoon.owner.freeShot();
        }
    }
    // Осколки, родившиеся уже в зоне шипов, лопаются сразу
    burstAtSpikes();
}

// ===== НОВОЕ: оверлеи рисуются КАЖДЫЙ кадр — поэтому не пропадают =====
function drawOverlay(title, subtitle, titleColor) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
    ctx.fillRect(0, 0, c.w, c.h);

    ctx.textAlign = "center";
    ctx.fillStyle = titleColor;
    ctx.font = "72px sans-serif";
    ctx.fillText(title, c.w / 2, c.h / 2 - 20);

    ctx.fillStyle = "#ddd";
    ctx.font = "28px sans-serif";
    ctx.fillText(subtitle, c.w / 2, c.h / 2 + 40);
    ctx.textAlign = "left";
}

// Ряд шипов вдоль верха экрана (остриями вниз)
function drawSpikes() {
    ctx.fillStyle = "#cfd8dc";
    ctx.strokeStyle = "#78909c";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x < c.w; x += SPIKE_WIDTH) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x + SPIKE_WIDTH / 2, SPIKE_HEIGHT);
        ctx.lineTo(x + SPIKE_WIDTH, 0);
    }
    ctx.fill();
    ctx.stroke();
}

function drawHUD() {
    ctx.font = "24px sans-serif";
    ctx.fillStyle = "#eee";
    ctx.textAlign = "left";
    ctx.fillText(`Уровень: ${level + 1}/${levels.length}`, 10, c.h - 15);
    // Жизни каждого игрока — справа налево, цветом игрока
    ctx.textAlign = "right";
    for (let i = players.length - 1; i >= 0; i--) {
        const p = players[i];
        const hearts = p.out ? "✖" : "♥".repeat(Math.max(p.lives, 0));
        ctx.fillStyle = p.out ? "#888" : p.color;
        ctx.fillText(`Игрок ${p.number + 1}: ${hearts}`, c.w - 10 - (players.length - 1 - i) * HUD_PLAYER_WIDTH, c.h - 15);
    }
    ctx.textAlign = "left";
}

function paint() {
    if (gameState === "title") {
        drawTitle();
        if (debug) printKeys(ctx);
        return;
    }
    ctx.fillStyle = "#444";
    ctx.strokeStyle = "#888";
    ctx.fillRect(0, 0, c.w, c.h);

    if (currentSpikes) {
        drawSpikes();
    }

    for (const harpoon of harpoons) {
        harpoon.draw(ctx);
    }

    for (let enemy of currentLevel) {
        enemy.draw(ctx);
    }

    for (let player of players) {
        player.draw(ctx);
    }

    drawHUD();

    // Оверлеи — в самом конце, поверх всего, и каждый кадр
    if (gameState === "gameover") {
        drawOverlay("GAME OVER", "Нажмите Enter, чтобы начать заново", "#e53935");
    } else if (gameState === "win") {
        drawOverlay("ПОБЕДА!", "Нажмите Enter, чтобы сыграть ещё раз", "gold");
    } else if (pause) {
        if (mousePlayer() && !mouseLocked()) {
            drawOverlay("PAUSE", lockError ? "Не удалось захватить мышь — кликните ещё раз" : "Кликните, чтобы продолжить", "#bbb");
        } else {
            drawOverlay("PAUSE", "ESC / P — продолжить", "#bbb");
        }
    }

    if (debug) {
        printKeys(ctx);
    }
}

function debugSpeed() {
    if (currentKeys["pageup"] && gameSpeed < 3) {
        gameSpeed += 0.01;
    } else if (currentKeys["pagedown"] && gameSpeed > 0.1) {
        gameSpeed -= 0.01;
    }
}

function debugToggle() {
    if (currentKeys["f2"]) {
        if (!debugHeld) debug = !debug;
        debugHeld = true;
    } else {
        debugHeld = false;
    }
}

// ===== Захват курсора (мышь) =====
function mouseLocked() {
    return document.pointerLockElement === canvas;
}

function lockSupported() {
    return typeof canvas.requestPointerLock === "function";
}

function mousePlayer() {
    return players.find((p) => p.control === "mouse");
}

// Вызывать из обработчика действия пользователя (клавиша, клик) — иначе браузер откажет.
function requestMouseLock() {
    lockError = false;
    if (!lockSupported()) {
        lockError = true;
        return;
    }
    lockPendingUntil = time + LOCK_WAIT_FRAMES;
    try {
        const result = canvas.requestPointerLock();
        if (result && typeof result.catch === "function") {
            result.catch(() => { lockError = true; lockPendingUntil = 0; });
        }
    } catch (e) {
        lockError = true;
        lockPendingUntil = 0;
    }
}

// ===== Меню старта: способ управления и число игроков =====
const MENU_TOP = 330;
const MENU_ITEM_H = 64;
const MENU_ITEM_W = 900;
let menu = { step: 0, index: 0, control: "keyboard" };

function menuItems() {
    const noMouse = !lockSupported();
    if (menu.step === 0) {
        return [
            { label: "Клавиатура:  ← →  движение,  ↑  выстрел", value: "keyboard" },
            { label: "Мышь:  смещение — движение,  левая кнопка — выстрел", value: "mouse", disabled: noMouse },
        ];
    }
    return [
        { label: "Нет — один игрок", value: 1 },
        { label: "Да — вдвоём:  игрок 1 — стрелки,  игрок 2 — мышь", value: 2, disabled: noMouse },
    ];
}

function menuMove(delta) {
    const n = menuItems().length;
    menu.index = (menu.index + delta + n) % n;
}

function menuBack() {
    if (menu.step === 1) {
        menu.step = 0;
        menu.index = menu.control === "mouse" ? 1 : 0;
    }
}

// Подтвердить пункт. Шаг 1 — способ управления для первого игрока,
// шаг 2 — играть вдвоём. В игре вдвоём первый игрок всегда с клавиатурой,
// второй — с мышью.
function menuConfirm() {
    const item = menuItems()[menu.index];
    if (!item || item.disabled) return;
    if (menu.step === 0) {
        menu.control = item.value;
        menu.step = 1;
        menu.index = 0;
        return;
    }
    const list = item.value === 2 ? ["keyboard", "mouse"] : [menu.control];
    startGame({ controls: list });
    if (list.includes("mouse")) requestMouseLock();
}

function menuKey(id) {
    if (id === "arrowup") menuMove(-1);
    else if (id === "arrowdown") menuMove(1);
    else if (id === "enter" || id === "numpadenter" || id === "space") menuConfirm();
    else if (id === "escape" || id === "backspace") menuBack();
}

// Координаты события мыши в логических координатах поля
function canvasPoint(e) {
    const r = canvas.getBoundingClientRect();
    const w = Math.max(r.width - 2 * CANVAS_BORDER, 1);
    const h = Math.max(r.height - 2 * CANVAS_BORDER, 1);
    return {
        x: (e.clientX - r.left - CANVAS_BORDER) * c.w / w,
        y: (e.clientY - r.top - CANVAS_BORDER) * c.h / h,
    };
}

function menuItemAt(point) {
    const items = menuItems();
    for (let i = 0; i < items.length; i++) {
        const top = MENU_TOP + i * MENU_ITEM_H;
        if (Math.abs(point.x - c.w / 2) <= MENU_ITEM_W / 2 && point.y >= top && point.y <= top + MENU_ITEM_H - 12) {
            return i;
        }
    }
    return -1;
}

// ===== Титульный экран =====
// Декоративные шары на фоне; не участвуют в игре.
let titleBalls = [
    new Circle(3, { x: 200, y: 200 }, 2, "#e91e63"),
    new Circle(2, { x: 500, y: 300 }, -2, "#9c27b0"),
    new Circle(4, { x: 900, y: 250 }, 3, "#009688"),
    new Circle(1, { x: 1100, y: 400 }, -3, "#ffc107"),
];

function updateTitle() {
    for (const ball of titleBalls) ball.update(gameSpeed);
}

function drawTitle() {
    ctx.fillStyle = "#444";
    ctx.fillRect(0, 0, c.w, c.h);
    for (const ball of titleBalls) ball.draw(ctx);

    ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
    ctx.fillRect(0, 0, c.w, c.h);
    ctx.textAlign = "center";
    ctx.fillStyle = "gold";
    ctx.font = "bold 96px sans-serif";
    ctx.fillText("ПУЗЫРЬКИ", c.w / 2, 180);

    ctx.fillStyle = "#fff";
    ctx.font = "34px sans-serif";
    ctx.fillText(menu.step === 0 ? "Как управлять?" : "Играть вдвоём?", c.w / 2, 270);

    ctx.font = "28px sans-serif";
    menuItems().forEach((item, i) => {
        const top = MENU_TOP + i * MENU_ITEM_H;
        if (i === menu.index) {
            ctx.fillStyle = "rgba(255, 215, 0, 0.18)";
            ctx.fillRect(c.w / 2 - MENU_ITEM_W / 2, top, MENU_ITEM_W, MENU_ITEM_H - 12);
            ctx.strokeStyle = "gold";
            ctx.strokeRect(c.w / 2 - MENU_ITEM_W / 2, top, MENU_ITEM_W, MENU_ITEM_H - 12);
        }
        ctx.fillStyle = item.disabled ? "#777" : (i === menu.index ? "#fff" : "#ccc");
        const label = item.disabled ? `${item.label}  (недоступно в этом браузере)` : item.label;
        ctx.fillText(label, c.w / 2, top + 34);
    });

    ctx.fillStyle = "#ddd";
    ctx.font = "24px sans-serif";
    if (menu.step === 1 && menu.control === "mouse") {
        ctx.fillText("В игре вдвоём игрок 1 переключается на стрелки, игрок 2 получает мышь", c.w / 2, 530);
    }
    ctx.fillText("↑ ↓ — выбор,  Enter — подтвердить,  Esc — назад;  можно мышью", c.w / 2, 640);
    ctx.fillText("Esc / P — пауза в игре", c.w / 2, 675);
    ctx.textAlign = "left";
}

// Запомнить позиции всех объектов перед шагом логики (для интерполяции).
function savePrevAll() {
    for (const list of [harpoons, currentLevel, players, titleBalls]) {
        for (const obj of list) obj.savePrev();
    }
}

// Один шаг игры (1/60 с): логика + служебные клавиши. Без отрисовки.
function tick() {
    const restartKey = !!(currentKeys["enter"] || currentKeys["numpadenter"] || currentKeys["keyr"]);
    savePrevAll();
    // ИСПРАВЛЕНО: явный автомат состояний вместо pause = true
    if (gameState === "title") {
        updateTitle();
    } else if (gameState === "gameover" || gameState === "win") {
        // Ждём Enter/R для рестарта; логика не крутится,
        // но paint() рисует оверлей каждый кадр.
        // Только по свежему нажатию: удерживаемый выстрел (Enter у игрока 2)
        // не должен сразу перезапускать игру.
        if (restartKey && !restartHeld) {
            restart();
        }
    } else if (!paused()) {
        logic();
    }

    // Игра с мышью невозможна без захвата курсора: теряем захват — пауза
    if (gameState === "playing" && mousePlayer() && !mouseLocked() && time >= lockPendingUntil && !pause) {
        pause = true;
        pausedByLockLoss = true;
    }

    debugSpeed();
    debugToggle();
    restartHeld = restartKey;
    prevKeys = Object.assign({}, currentKeys);
    // Движение мыши и щелчок живут один шаг
    mouse.dx = 0;
    mouse.clicked = false;

    time++;
}

// Накопить прошедшее время и выполнить нужное число шагов; вернуть их количество.
function advance(timestamp) {
    let dt = STEP_MS;
    if (timestamp != null && lastTimestamp != null) {
        dt = Math.min(Math.max(timestamp - lastTimestamp, 0), MAX_FRAME_MS);
    }
    if (timestamp != null) lastTimestamp = timestamp;
    accumulator += dt;
    let steps = 0;
    while (accumulator >= STEP_MS - 1e-6) {
        accumulator -= STEP_MS;
        tick();
        steps++;
    }
    renderAlpha = Math.min(Math.max(accumulator / STEP_MS, 0), 1);
    return steps;
}

// Экран ошибки: цикл жив, пользователь видит причину и может начать заново.
function drawFatalError() {
    ctx.fillStyle = "#222";
    ctx.fillRect(0, 0, c.w, c.h);
    drawOverlay("ОШИБКА", "Нажмите Enter, чтобы начать заново", "#e53935");
    ctx.textAlign = "center";
    ctx.fillStyle = "#999";
    ctx.font = "20px monospace";
    ctx.fillText(String(fatalError && fatalError.message || fatalError).slice(0, 110), c.w / 2, c.h / 2 + 90);
    ctx.textAlign = "left";
}

function recoverFromError() {
    fatalError = null;
    accumulator = 0;
    prevKeys = Object.assign({}, currentKeys);
    if (players.length === 0) {
        menu = { step: 0, index: 0, control: "keyboard" };
        gameState = "title";
    } else {
        startGame({ controls: players.map((p) => p.control) });
        if (mousePlayer()) requestMouseLock();
    }
}

// Кадр браузера (requestAnimationFrame). Следующий кадр планируется первым,
// чтобы исключение в логике или отрисовке не останавливало цикл.
function loop(timestamp) {
    window.requestAnimationFrame(loop);
    try {
        if (fatalError) {
            const fresh = Object.keys(currentKeys).some((k) => currentKeys[k] && !prevKeys[k] &&
                (k === "enter" || k === "numpadenter" || k === "keyr"));
            prevKeys = Object.assign({}, currentKeys);
            if (fresh) recoverFromError();
            else drawFatalError();
            return;
        }
        advance(timestamp);
        paint();
    } catch (e) {
        fatalError = e;
        renderAlpha = 1;
        prevKeys = Object.assign({}, currentKeys); // удержанные клавиши не считаются свежими
        console.error(e);
        try { drawFatalError(); } catch (_) { /* канвас недоступен */ }
    }
}

// ========== listeners.js ==========
// Идентификатор клавиши: физический код; запасной вариант — символ клавиши.
function keyId(e) {
    return (e.code || e.key || "").toLowerCase();
}

const PREVENT_DEFAULT_KEYS = new Set([
    "space", "arrowup", "arrowdown", "arrowleft", "arrowright", "enter",
]);

document.addEventListener("keydown", (e) => {
    const id = keyId(e);
    if (PREVENT_DEFAULT_KEYS.has(id)) e.preventDefault();
    currentKeys[id] = true;
    // Меню старта управляется событиями: захват курсора разрешён только из обработчика действия
    if (gameState === "title" && !e.repeat) menuKey(id);
});

document.addEventListener("keyup", (e) => {
    const id = keyId(e);
    if (PREVENT_DEFAULT_KEYS.has(id)) e.preventDefault();
    currentKeys[id] = false;
});

// ===== Мышь =====
document.addEventListener("mousemove", (e) => {
    if (gameState === "title") {
        const i = menuItemAt(canvasPoint(e));
        if (i >= 0 && !menuItems()[i].disabled) menu.index = i;
    } else if (mouseLocked()) {
        mouse.dx += e.movementX || 0;
    }
});

document.addEventListener("mousedown", (e) => {
    if (e.button !== 0) return;   // правая кнопка и колесо игнорируются
    if (gameState === "title") {
        const i = menuItemAt(canvasPoint(e));
        if (i >= 0 && !menuItems()[i].disabled) {
            menu.index = i;
            menuConfirm();
        }
        return;
    }
    // Клик возвращает захват курсора; сам этот клик не стреляет
    if (mousePlayer() && !mouseLocked()) {
        requestMouseLock();
        if (gameState === "gameover" || gameState === "win") restart();
        return;
    }
    if (gameState === "gameover" || gameState === "win") {
        restart();
        return;
    }
    if (gameState === "playing" && !pause) {
        mouse.held = true;
        mouse.clicked = true;
    }
});

document.addEventListener("mouseup", (e) => {
    if (e.button === 0) mouse.held = false;
});

document.addEventListener("contextmenu", (e) => e.preventDefault());

document.addEventListener("pointerlockchange", () => {
    lockPendingUntil = 0;
    if (mouseLocked()) {
        lockError = false;
        if (pausedByLockLoss) {
            pause = false;
            pausedByLockLoss = false;
        }
    }
});

document.addEventListener("pointerlockerror", () => {
    lockError = true;
    lockPendingUntil = 0;
});

// Потеря фокуса: keyup уже не придёт, поэтому сбрасываем нажатые клавиши и мышь
// и ставим игру на паузу, чтобы персонаж не «убегал» сам.
function releaseAllKeys() {
    currentKeys = {};
    mouse = { dx: 0, held: false, clicked: false };
    if (gameState === "playing") pause = true;
}
window.addEventListener("blur", releaseAllKeys);
document.addEventListener("visibilitychange", () => {
    if (document.hidden) releaseAllKeys();
});

window.addEventListener("resize", resize);

// ИСПРАВЛЕНО: простой и предсказуемый расчёт масштаба
function resize() {
    const pixelRatio = window.devicePixelRatio || 1;
    // Рамка канваса рисуется снаружи (content-box), поэтому вычитаем её из доступной области
    const availW = window.innerWidth - 2 * CANVAS_BORDER;
    const availH = window.innerHeight - 2 * CANVAS_BORDER;

    const rescale = Math.max(Math.min(availW / c.w, availH / c.h, 1.25), 0.1);

    // Целые размеры: иначе браузер округляет сам и картинка слегка пересэмплируется
    const cssW = Math.round(c.w * rescale);
    const cssH = Math.round(c.h * rescale);
    canvas.style.width = `${cssW}px`;
    canvas.style.height = `${cssH}px`;
    canvas.width = Math.round(cssW * pixelRatio);
    canvas.height = Math.round(cssH * pixelRatio);

    viewScale = cssW / c.w;

    ctx.imageSmoothingEnabled = false;
    ctx.setTransform(canvas.width / c.w, 0, 0, canvas.height / c.h, 0, 0);
}

resize();

// ========== Запуск ==========
// Игра стартует с титульного экрана (gameState = "title"), игроки
// создаются в startGame().
window.requestAnimationFrame(loop);
</script>
</html>
