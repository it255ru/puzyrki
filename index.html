<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пузырьки</title>
    <style type="text/css">
        body {
            margin: 0;
            background: black;
        }
        div {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            border: 5px dashed gold;
        }
    </style>
</head>
<body>
    <div>
        <canvas id="canvas" height=720 width=1280>
        </canvas>
    </div>
</body>
<script type="text/javascript">
// ========== vars.js ==========
const c = {w: 1280, h: 720}
const weight = 0.2;
const sizes = [
    { bs: 9,  r: 10, weightMod: 1 },
    { bs: 11, r: 20, weightMod: 1 },
    { bs: 13, r: 30, weightMod: 1 },
    { bs: 14, r: 40, weightMod: 1 },
    { bs: 15, r: 50, weightMod: 1 },
    { bs: 12, r: 70, weightMod: 0.7 },
    { bs: 9,  r: 80, weightMod: 0.4 },
];
let levels = [];

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let time = 0;
let gameSpeed = 1;
let level = 0;
let debug = false;
let debugHeld = false;
// >0 — пауза между уровнями, 0 — пора загрузить уровень, -1 — уровень загружен
let levelCountdown = -1;

let currentKeys = {};

let harpoons = [];

let pause = false;
let pauseHeld = false;
let restartHeld = false;

// ===== НОВОЕ: состояние игры и жизни =====
// "playing" | "gameover" | "win"
let gameState = "playing";
const MAX_LIVES = 3;
let lives = MAX_LIVES;
// Небольшая неуязвимость после потери жизни (в кадрах),
// чтобы не потерять все жизни за одно касание.
let invulnerableTimer = 0;

// Клавиши задаются физическим кодом (KeyboardEvent.code в нижнем регистре),
// поэтому не зависят от раскладки (русская, US и т. д.) и от Shift.
const MAX_PLAYERS = 2;
let controls = {
    players: [
        { "keya": "left", "keyd": "right", "space": "shoot" },
        {
            "arrowleft": "left", "arrowright": "right",
            "enter": "shoot", "numpadenter": "shoot", "controlright": "shoot",
        },
    ],
};

let playerColors = [
    "green",
    "blue",
];

let currentLevel = [];
let players = [];

// ========== classes.js ==========
class Shape {
    constructor(position, color) {
        this.x = position.x;
        this.y = position.y;
        this.color = color || "#666";
    }
}

class Harpoon extends Shape {
    constructor(position, owner, color, modifiers) {
        super(position, color);
        this.h = 0;
        this.hits = 0;
        this.owner = owner;
        this.popping = true;
        this.modifiers = modifiers || {};
        this.modifiers.speed = this.modifiers.speed || 12;
        this.modifiers.maxHits = this.modifiers.maxHits || 1;
    }

    draw(ctx) {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x - 1, this.y - this.h, 3, this.h);

        ctx.beginPath();
        ctx.moveTo(this.x - 2, this.y - this.h);
        ctx.lineTo(this.x + 0.5, this.y - this.h - 15);
        ctx.lineTo(this.x + 3, this.y - this.h);
        ctx.fill();
    }

    bounds() {
        return {
            x1: this.x - 1,
            x2: this.x + 2,
            y1: this.y - this.h - 15,
            y2: this.y,
        };
    }

    update(speed) {
        this.h += this.modifiers["speed"] * speed;
        return this.y - this.h >= 15;
    }
}

class Enemy extends Shape {
    constructor(size, position, color) {
        super(position, color);
        this.size = size;
    }
    intersects(shape) {}
}

class Circle extends Enemy {
    constructor(size, position, initialSpeed, color) {
        super(size, position, color);
        const thisSize = sizes[size];
        if (!thisSize) throw new RangeError(`Circle: неизвестный размер ${size}`);
        this.dx = initialSpeed;
        this.dy = -5;
        this.r = thisSize.r;
        this.bs = thisSize.bs;
        this.weightMod = thisSize.weightMod || 1;
    }

    draw(ctx) {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, 2 * Math.PI);
        ctx.closePath();
        ctx.fill();
    }

    bounds() {
        return {
            x1: this.x - this.r,
            y1: this.y - this.r,
            x2: this.x + this.r,
            y2: this.y + this.r,
        }
    }

    update(speed) {
        this.x += this.dx * speed;
        this.gravity(speed);
        if (this.x > c.w - this.r || this.x < this.r) {
            this.dx = -this.dx;
            this.x += this.dx * speed;
        }
    }

    intersects(bound) {
        const b2 = this.bounds();
        return !(b2.x2 < bound.x1 ||
                b2.x1 > bound.x2 ||
                b2.y2 < bound.y1 ||
                b2.y1 > bound.y2);
    }

    gravity(speed) {
        this.dy += weight * this.weightMod * speed;
        this.y += this.dy * speed;
        if (this.y > c.h - this.r) {
            this.dy = -this.bs;
            this.y += this.dy * speed;
        }
    }
}

class Player extends Shape {
    constructor(position, playerNumber) {
        super(position, playerColors[playerNumber]);
        this.number = playerNumber;
        this.cooldown = 0;
        this.shooting = false;
        this.modifiers = {
            speed: 1,
            maxShots: 1,
            cooldown: 15,
        };
        this.shots = this.modifiers.maxShots;
    }

    draw(ctx) {
        // Мигание во время неуязвимости
        if (invulnerableTimer > 0 && Math.floor(time / 5) % 2 === 0) {
            return;
        }
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x - 15, this.y - 25, 30, 50);
        ctx.strokeRect(this.x - 15, this.y - 25, 30, 50);
    }

    bounds() {
        return {
            x1: this.x - 15,
            x2: this.x + 15,
            y1: this.y - 25,
            y2: this.y + 25,
        }
    }

    update(speed) {
        const {speed: speedMod} = this.modifiers;
        const input = readInput(this.number);
        if (input["left"] && !input["right"]) {
            this.x -= 5 * speed * speedMod;
            if (this.x < 15) this.x = 15;
        } else if (input["right"] && !input["left"]) {
            this.x += 5 * speed * speedMod;
            if (this.x > c.w - 15) this.x = c.w - 15;
        }
        this.cooldown -= 1 * speed;
        if (this.cooldown <= 0 && input["shoot"] && this.shots > 0) {
            this.shots--;
            this.cooldown = this.modifiers.cooldown;
            // ИСПРАВЛЕНО: передаём цвет игрока гарпуну
            harpoons.push(new Harpoon({x: this.x, y: this.y + 25}, this, this.color));
        }
    }

    freeShot() {
        if (this.shots < this.modifiers.maxShots) {
            this.shots++;
        }
    }
}

// Действия игрока (left/right/shoot) по нажатым клавишам.
function readInput(playerNumber) {
    const input = {};
    const map = controls.players[playerNumber];
    for (const key of Object.keys(currentKeys)) {
        if (currentKeys[key] && map[key]) {
            input[map[key]] = true;
        }
    }
    return input;
}

// ========== levels.js ==========
// Уровни — данные: { balls: [{ size, x, y, dx, color? }] }.
// Объекты Circle создаются заново при каждой загрузке (см. loadLevel).
levels = [
    { balls: [
        { size: 2, x: c.w / 2, y: 200, dx: 3, color: "#3f51b5" },
    ] },
    { balls: [
        { size: 2, x: c.w / 3, y: 200, dx: -3, color: "#2196f3" },
        { size: 2, x: c.w * 2 / 3, y: 200, dx: 3, color: "#2196f3" },
    ] },
    { balls: [
        { size: 3, x: c.w / 2, y: 200, dx: 3, color: "#009688" },
    ] },
    { balls: [
        { size: 3, x: c.w / 2, y: 200, dx: 4, color: "#009688" },
    ] },
    { balls: [
        { size: 0, x: 100, y: 500, dx: 3 },
        { size: 1, x: 200, y: 500, dx: 3 },
        { size: 2, x: 300, y: 500, dx: 3 },
        { size: 1, x: 400, y: 500, dx: 3 },
        { size: 0, x: 500, y: 500, dx: 3 },
    ] },
];

// Высота зоны игрока снизу: шар не должен стартовать над головой игрока.
const PLAYER_ZONE = 50;

// Проверка данных уровня; бросает Error с номером уровня и шара.
function validateLevel(def, index) {
    const where = (i) => `уровень ${index + 1}, шар ${i + 1}`;
    if (!def || !Array.isArray(def.balls) || def.balls.length === 0) {
        throw new Error(`уровень ${index + 1}: нужен непустой список balls`);
    }
    def.balls.forEach((b, i) => {
        if (!Number.isInteger(b.size) || b.size < 0 || b.size >= sizes.length) {
            throw new Error(`${where(i)}: size должен быть целым от 0 до ${sizes.length - 1}, получено ${b.size}`);
        }
        const r = sizes[b.size].r;
        if (!Number.isFinite(b.x) || b.x < r || b.x > c.w - r) {
            throw new Error(`${where(i)}: x=${b.x} вне [${r}, ${c.w - r}]`);
        }
        if (!Number.isFinite(b.y) || b.y < r || b.y + r > c.h - PLAYER_ZONE) {
            throw new Error(`${where(i)}: y=${b.y} вне [${r}, ${c.h - PLAYER_ZONE - r}]`);
        }
        if (!Number.isFinite(b.dx)) {
            throw new Error(`${where(i)}: dx должен быть числом, получено ${b.dx}`);
        }
        if (b.color !== undefined && typeof b.color !== "string") {
            throw new Error(`${where(i)}: color должен быть строкой`);
        }
    });
}

function createBalls(def) {
    return def.balls.map((b) => new Circle(b.size, { x: b.x, y: b.y }, b.dx, b.color));
}

levels.forEach(validateLevel);

// ========== index.js ==========
function checkHit(type, targetType, maxHits) {
    const toSplit = new Set();
    let hits = 0;
    for (const t1 of type) {
        const b1 = t1.bounds();
        for (let i = 0; i < targetType.length; i++) {
            if (toSplit.has(i)) continue;
            const t2 = targetType[i];
            if (!t2.intersects(b1)) continue;
            if (t1.popping) toSplit.add(i);
            hits++;
            if (maxHits && hits >= maxHits) break;
        }
        if (maxHits && hits >= maxHits) break;
    }
    [...toSplit].sort((a, b) => b - a).forEach(i => split(i, targetType));
    return hits;
}

function split(index, array) {
    const obj = array[index];
    if (!obj) return;
    array.splice(index, 1);
    const size = obj.size - 1;
    if (size >= 0) {
        const pos = { x: obj.x, y: obj.y };
        const dx = obj.dx || (Math.random() > 0.5 ? 2 : -2);
        array.push(
            new obj.constructor(size, pos,  dx, obj.color),
            new obj.constructor(size, pos, -dx, obj.color)
        );
    }
}

function paused() {
    if (currentKeys["escape"] || currentKeys["keyp"]) {
        if (!pauseHeld) pause = !pause;
        pauseHeld = true;
    } else {
        pauseHeld = false;
    }
    return pause;
}

function printKeys(ctx) {
    if (currentKeys) {
        let message = "";
        for (const key of Object.keys(currentKeys)) {
            if (currentKeys[key]) {
                message += key + " ";
            }
        }
        ctx.font = "24px sans-serif";
        ctx.fillStyle = "#bbb";
        ctx.fillText(message, 10, 30);
    }
}

function positionPlayers() {
    const number = players.length;
    for (let i = 0; i < number; i++) {
        const player = players[i];
        player.y = c.h - 25;
        player.x = c.w * (i + 1) / (number + 1);
    }
}

// Шары создаются заново из данных уровня, поэтому каждая загрузка
// (старт, потеря жизни, рестарт) начинается с исходного состояния.
function loadLevel(n) {
    currentLevel = createBalls(levels[n]);
    harpoons = [];
    for (const p of players) {
        p.shots = p.modifiers.maxShots;
        p.cooldown = 0;
    }
    positionPlayers();
}

// ===== НОВОЕ: обработка попадания в игрока =====
function onPlayerHit() {
    lives--;
    if (lives <= 0) {
        gameState = "gameover";
        harpoons = [];
    } else {
        // Перезапускаем текущий уровень, даём неуязвимость
        loadLevel(level);
        invulnerableTimer = 120; // ~2 секунды
    }
}

// ===== НОВОЕ: полный рестарт игры =====
function restart() {
    level = 0;
    lives = MAX_LIVES;
    levelCountdown = -1;
    invulnerableTimer = 0;
    pause = false;
    loadLevel(0);
    gameState = "playing";
}

function logic() {
    if (invulnerableTimer > 0) {
        invulnerableTimer -= gameSpeed;
    }

    if (currentLevel.length == 0) {
        if (levelCountdown > 0) {
            levelCountdown--;
        } else if (levelCountdown === 0) {
            levelCountdown = -1;
            loadLevel(level);
        } else if (level + 1 < levels.length) {
            level++;
            levelCountdown = 90;
        } else {
            // ИСПРАВЛЕНО: раньше после последнего уровня игра просто
            // зависала на пустом экране. Теперь — победа.
            gameState = "win";
            return;
        }
    }

    for (let enemy of currentLevel) {
        enemy.update(gameSpeed);
    }

    for (let player of players) {
        player.update(gameSpeed);
        // ИСПРАВЛЕНО: вместо pause = true — система жизней.
        // Неуязвимость защищает от повторного срабатывания.
        if (invulnerableTimer <= 0 && checkHit([player], currentLevel, 1)) {
            onPlayerHit();
            if (gameState !== "playing") return;
        }
    }

    for (let i = harpoons.length - 1; i >= 0; i--) {
        const harpoon = harpoons[i];
        const hitStatic = harpoon.update(gameSpeed);
        harpoon.hits += checkHit([harpoon], currentLevel, harpoon.modifiers.maxHits);
        if (harpoon.hits >= harpoon.modifiers.maxHits || !hitStatic) {
            harpoons.splice(i, 1);
            harpoon.owner.freeShot();
        }
    }
}

// ===== НОВОЕ: оверлеи рисуются КАЖДЫЙ кадр — поэтому не пропадают =====
function drawOverlay(title, subtitle, titleColor) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
    ctx.fillRect(0, 0, c.w, c.h);

    ctx.textAlign = "center";
    ctx.fillStyle = titleColor;
    ctx.font = "72px sans-serif";
    ctx.fillText(title, c.w / 2, c.h / 2 - 20);

    ctx.fillStyle = "#ddd";
    ctx.font = "28px sans-serif";
    ctx.fillText(subtitle, c.w / 2, c.h / 2 + 40);
    ctx.textAlign = "left";
}

function drawHUD() {
    ctx.font = "24px sans-serif";
    ctx.fillStyle = "#eee";
    ctx.textAlign = "left";
    ctx.fillText(`Уровень: ${level + 1}/${levels.length}`, 10, c.h - 15);
    ctx.textAlign = "right";
    ctx.fillText(`Жизни: ${"♥".repeat(Math.max(lives, 0))}`, c.w - 10, c.h - 15);
    ctx.textAlign = "left";
}

function paint() {
    ctx.fillStyle = "#444";
    ctx.strokeStyle = "#888";
    ctx.fillRect(0, 0, c.w, c.h);

    for (const harpoon of harpoons) {
        harpoon.draw(ctx);
    }

    for (let enemy of currentLevel) {
        enemy.draw(ctx);
    }

    for (let player of players) {
        player.draw(ctx);
    }

    drawHUD();

    // Оверлеи — в самом конце, поверх всего, и каждый кадр
    if (gameState === "gameover") {
        drawOverlay("GAME OVER", "Нажмите Enter, чтобы начать заново", "#e53935");
    } else if (gameState === "win") {
        drawOverlay("ПОБЕДА!", "Нажмите Enter, чтобы сыграть ещё раз", "gold");
    } else if (pause) {
        drawOverlay("PAUSE", "ESC / P — продолжить", "#bbb");
    }

    if (debug) {
        printKeys(ctx);
    }
}

function debugSpeed() {
    if (currentKeys["pageup"] && gameSpeed < 3) {
        gameSpeed += 0.01;
    } else if (currentKeys["pagedown"] && gameSpeed > 0.1) {
        gameSpeed -= 0.01;
    }
}

function debugToggle() {
    if (currentKeys["f2"]) {
        if (!debugHeld) debug = !debug;
        debugHeld = true;
    } else {
        debugHeld = false;
    }
}

// Второй игрок подключается нажатием своей кнопки выстрела во время игры.
// Появляется на свободной половине поля, не сдвигая первого игрока.
function hotJoin() {
    if (gameState !== "playing" || pause || players.length >= MAX_PLAYERS) return;
    if (!readInput(players.length).shoot) return;
    const player = new Player({x: c.w / 2, y: c.h - 25}, players.length);
    const taken = players.map((p) => p.x);
    player.x = taken[0] < c.w / 2 ? c.w * 0.75 : c.w * 0.25;
    players.push(player);
}

function step() {
    const restartKey = !!(currentKeys["enter"] || currentKeys["numpadenter"] || currentKeys["keyr"]);
    // ИСПРАВЛЕНО: явный автомат состояний вместо pause = true
    if (gameState === "gameover" || gameState === "win") {
        // Ждём Enter/R для рестарта; логика не крутится,
        // но paint() ниже отрисовывает оверлей каждый кадр.
        // Только по свежему нажатию: удерживаемый выстрел (Enter у игрока 2)
        // не должен сразу перезапускать игру.
        if (restartKey && !restartHeld) {
            restart();
        }
    } else if (!paused()) {
        logic();
    }

    paint();
    debugSpeed();
    debugToggle();
    hotJoin();
    restartHeld = restartKey;

    time++;
    window.requestAnimationFrame(step);
}

// ========== listeners.js ==========
// Идентификатор клавиши: физический код; запасной вариант — символ клавиши.
function keyId(e) {
    return (e.code || e.key || "").toLowerCase();
}

const PREVENT_DEFAULT_KEYS = new Set([
    "space", "arrowup", "arrowdown", "arrowleft", "arrowright", "enter",
]);

document.addEventListener("keydown", (e) => {
    const id = keyId(e);
    if (PREVENT_DEFAULT_KEYS.has(id)) e.preventDefault();
    currentKeys[id] = true;
});

document.addEventListener("keyup", (e) => {
    const id = keyId(e);
    if (PREVENT_DEFAULT_KEYS.has(id)) e.preventDefault();
    currentKeys[id] = false;
});

// Потеря фокуса: keyup уже не придёт, поэтому сбрасываем нажатые клавиши
// и ставим игру на паузу, чтобы персонаж не «убегал» сам.
function releaseAllKeys() {
    currentKeys = {};
    if (gameState === "playing") pause = true;
}
window.addEventListener("blur", releaseAllKeys);
document.addEventListener("visibilitychange", () => {
    if (document.hidden) releaseAllKeys();
});

window.addEventListener("resize", resize);

// ИСПРАВЛЕНО: простой и предсказуемый расчёт масштаба
function resize() {
    const pixelRatio = window.devicePixelRatio || 1;
    const availW = window.innerWidth;
    const availH = window.innerHeight;

    const rescale = Math.min(availW / c.w, availH / c.h, 1.25);

    canvas.width = c.w * rescale * pixelRatio;
    canvas.height = c.h * rescale * pixelRatio;

    canvas.style.width = `${c.w * rescale}px`;
    canvas.style.height = `${c.h * rescale}px`;

    ctx.imageSmoothingEnabled = false;
    ctx.setTransform(rescale * pixelRatio, 0, 0, rescale * pixelRatio, 0, 0);
}

resize();

// ========== Создание игроков ==========
players.push(new Player({x: c.w / 2, y: c.h - 25}, 0));

// ========== Запуск ==========
loadLevel(0);
window.requestAnimationFrame(step);
</script>
</html>
